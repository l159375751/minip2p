<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>relay.0x6d.net - Live Feed</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a0a;
      color: #00ff00;
      font-family: 'Courier New', monospace;
      padding: 20px;
      font-size: 14px;
      line-height: 1.4;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      border: 2px solid #00ff00;
      padding: 15px;
      background: #000;
      box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
      font-size: 24px;
      text-shadow: 0 0 10px #00ff00;
      animation: glow 2s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from { text-shadow: 0 0 5px #00ff00, 0 0 10px #00ff00; }
      to { text-shadow: 0 0 10px #00ff00, 0 0 20px #00ff00, 0 0 30px #00ff00; }
    }

    .status {
      text-align: center;
      margin-bottom: 15px;
      padding: 8px;
      background: #001a00;
      border: 1px solid #00ff00;
    }

    .status.connected { color: #00ff00; }
    .status.disconnected { color: #ff0000; }
    .status.connecting { color: #ffff00; }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      background: #001a00;
      color: #00ff00;
      border: 1px solid #00ff00;
      padding: 8px 16px;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      transition: all 0.2s;
    }

    button:hover {
      background: #00ff00;
      color: #000;
      box-shadow: 0 0 10px #00ff00;
    }

    button:active {
      transform: scale(0.95);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
      margin-bottom: 15px;
    }

    .stat {
      background: #001a00;
      border: 1px solid #00ff00;
      padding: 8px;
      text-align: center;
    }

    .stat-label {
      color: #00aa00;
      font-size: 11px;
    }

    .stat-value {
      color: #00ff00;
      font-size: 18px;
      font-weight: bold;
      margin-top: 5px;
    }

    .log-container {
      background: #000;
      border: 1px solid #00ff00;
      padding: 10px;
      height: 500px;
      overflow-y: auto;
      font-size: 12px;
    }

    .log-entry {
      margin-bottom: 8px;
      padding: 5px;
      border-left: 3px solid transparent;
      word-wrap: break-word;
    }

    .log-entry.event { border-left-color: #00ff00; background: #001a00; }
    .log-entry.req { border-left-color: #0088ff; background: #001a1a; }
    .log-entry.eose { border-left-color: #ffaa00; background: #1a1a00; }
    .log-entry.ok { border-left-color: #ff00ff; background: #1a001a; }
    .log-entry.system { border-left-color: #888888; background: #0a0a0a; }
    .log-entry.error { border-left-color: #ff0000; background: #1a0000; }

    .timestamp {
      color: #00aa00;
      margin-right: 10px;
    }

    .type {
      color: #ffff00;
      font-weight: bold;
      margin-right: 10px;
    }

    .kind {
      color: #ff00ff;
      margin-right: 10px;
    }

    .content {
      color: #00ff00;
    }

    .log-container::-webkit-scrollbar {
      width: 8px;
    }

    .log-container::-webkit-scrollbar-track {
      background: #000;
    }

    .log-container::-webkit-scrollbar-thumb {
      background: #00ff00;
      border: 1px solid #000;
    }

    .log-container::-webkit-scrollbar-thumb:hover {
      background: #00aa00;
    }

    select {
      background: #001a00;
      color: #00ff00;
      border: 1px solid #00ff00;
      padding: 8px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
    }

    .expandable-json summary {
      cursor: pointer;
      color: #00aa00;
      font-size: 11px;
      margin-top: 5px;
      outline: none;
    }
    .expandable-json summary:hover {
      text-decoration: underline;
    }
    .expandable-json pre {
      background: #001a00;
      border: 1px solid #00ff00;
      padding: 10px;
      margin-top: 5px;
      white-space: pre-wrap;
      word-break: break-all;
      color: #00ff00;
    }

    .whda-panel {
      margin-bottom: 15px;
      background: #001a00;
      border: 1px solid #00ff00;
      padding: 8px;
    }

    .whda-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
      font-size: 12px;
      color: #00ff00;
    }

    .whda-textarea {
      width: 100%;
      min-height: 140px;
      background: #000;
      color: #00ff00;
      border: 1px solid #00ff00;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      padding: 6px;
      resize: vertical;
      margin-bottom: 4px;
    }

    .whda-status {
      font-size: 11px;
      color: #00aa00;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>╔══ RELAY.0X6D.NET ══╗</h1>

    <div class="status" id="status">● CONNECTING...</div>

    <div class="controls">
      <button onclick="connect()">CONNECT</button>
      <button onclick="disconnect()">DISCONNECT</button>
      <button onclick="sendWebsocketPing()">SEND WS PING</button>
      <label style="color: #00ff00;">
        WHDA:
        <select id="whdaAction" onchange="handleWhdaAction()">
          <option value="">Select action</option>
          <option value="load-latest">Load latest from relay</option>
          <option value="new-note">Start new note</option>
          <option value="publish">Publish current note</option>
        </select>
      </label>
      <button onclick="clearLog()">CLEAR LOG</button>
      <button onclick="fetchRecent()">FETCH LAST 5 MIN</button>
      <label style="color: #00ff00;">
        Filter:
        <select id="kindFilter" onchange="applyFilter()">
          <option value="">All Events</option>
          <option value="25555">25555 (Search)</option>
          <option value="25556">25556 (Response)</option>
          <option value="25557">25557 (Who Has)</option>
          <option value="25558">25558 (Availability)</option>
          <option value="25559">25559 (Ping/Pong)</option>
          <option value="30317">30317 (Cinema)</option>
          <option value="1">1 (Notes)</option>
          <option value="0">0 (Metadata)</option>
        </select>
      </label>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-label">EVENTS RECEIVED</div>
        <div class="stat-value" id="eventCount">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">SEARCH (25555)</div>
        <div class="stat-value" id="searchCount">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">RESPONSES (25556)</div>
        <div class="stat-value" id="responseCount">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">WHO HAS (25557)</div>
        <div class="stat-value" id="whoHasCount">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">AVAILABLE (25558)</div>
        <div class="stat-value" id="availableCount">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">PING/PONG (25559)</div>
        <div class="stat-value" id="pingPongCount">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">CINEMA (30317)</div>
        <div class="stat-value" id="cinemaCount">0</div>
      </div>
    </div>

    <div class="whda-panel">
      <div class="whda-header">
        <span>WHDA note editor (kind 30317 / d=WHDA)</span>
        <span class="whda-status" id="whdaStatus">Idle</span>
      </div>
      <textarea
        id="whdaEditor"
        class="whda-textarea"
        placeholder="WHDA JSON will appear here when you load the latest note or start a new one. Edit and publish back to the relay."
      ></textarea>
    </div>

    <div class="log-container" id="log"></div>
  </div>

  <script src="https://unpkg.com/nostr-tools@2.7.2/lib/nostr.bundle.js"></script>
  <script>
    const RELAY_URL = 'wss://relay.0x6d.net';
    let relay = null;
    let sub = null;
    let allEvents = [];
    let stats = {
      total: 0,
      25555: 0,
      25556: 0,
      25557: 0,
      25558: 0,
      25559: 0,
      30317: 0
    };
    let sk = null;
    let pk = null;
    let whdaDraftEvent = null;

    const FANCY_COLORS = [
      '#7b68ee', '#ee82ee', '#ff69b4', '#00ff7f', '#40e0d0', '#1e90ff', '#ffdead', '#ff8c00', '#ff4500'
    ];

    function colorFromPublicKey(pk) {
        let hash = 0;
        if (pk.length === 0) return FANCY_COLORS[0];
        for (let i = 0; i < pk.length; i++) {
            hash = pk.charCodeAt(i) + ((hash << 5) - hash);
            hash = hash & hash;
        }
        return FANCY_COLORS[Math.abs(hash) % FANCY_COLORS.length];
    }

    function initializeKeys() {
        if (!sk) {
            try {
                sk = NostrTools.generateSecretKey();
                pk = NostrTools.getPublicKey(sk);
            } catch (e) {
                console.error("Failed to initialize Nostr keys", e);
                log('Fatal: Failed to initialize Nostr keys.', 'error');
            }
        }
    }

    function setWhdaStatus(message) {
      const el = document.getElementById('whdaStatus');
      if (el) el.textContent = message;
    }

    function updateStatus(message, state = 'connecting') {
      const status = document.getElementById('status');
      status.textContent = message;
      status.className = 'status ' + state;
    }

    function log(message, type = 'system', data = null) {
      const logDiv = document.getElementById('log');
      const entry = document.createElement('div');
      entry.className = 'log-entry ' + type;

      const now = new Date();
      const timestamp = now.toTimeString().split(' ')[0];

      let html = `<span class="timestamp">[${timestamp}]</span>`;
      html += `<span class="type">${type.toUpperCase()}</span>`;

      if (type === 'event' && data && data.pubkey) {
          const color = colorFromPublicKey(data.pubkey);
          html += ` <span class="content">Event from <b style="color: ${color};" title="${data.pubkey}">${data.pubkey}</b></span>`;
          html += ` <span class="kind">kind:${data.kind}</span>`;
          
          if (data.kind === 30317) {
              try {
                  const contentJSON = JSON.parse(data.content);
                  const prettyJSON = JSON.stringify(contentJSON, null, 2);
                  html += `<details class="expandable-json">`;
                  html += `<summary>Show/Hide Content</summary>`;
                  html += `<pre>${prettyJSON}</pre>`;
                  html += `</details>`;
              } catch (e) {
                  if (data.content) {
                    html += ` <span class="content">"${data.content}"</span>`;
                  }
              }
          } else {
              if (data.content && data.content.length < 100) {
                html += ` <span class="content">"${data.content}"</span>`;
              }
          }
      } else {
        html += `<span class="content">${message}</span>`;
        if (data) {
            if (data.kind) {
              html += ` <span class="kind">kind:${data.kind}</span>`;
            }
            if (data.content && data.content.length < 100) {
              html += ` <span class="content">"${data.content}"</span>`;
            }
        }
      }

      entry.innerHTML = html;
      logDiv.insertBefore(entry, logDiv.firstChild);

      // Keep max 100 entries
      while (logDiv.children.length > 100) {
        logDiv.removeChild(logDiv.lastChild);
      }
    }

    function updateStats() {
      document.getElementById('eventCount').textContent = stats.total;
      document.getElementById('searchCount').textContent = stats[25555] || 0;
      document.getElementById('responseCount').textContent = stats[25556] || 0;
      document.getElementById('whoHasCount').textContent = stats[25557] || 0;
      document.getElementById('availableCount').textContent = stats[25558] || 0;
      document.getElementById('pingPongCount').textContent = stats[25559] || 0;
      document.getElementById('cinemaCount').textContent = stats[30317] || 0;
    }

    async function connect() {
      if (relay) {
        log('Already connected', 'system');
        return;
      }
      initializeKeys();

      try {
        updateStatus('● CONNECTING...', 'connecting');
        log('Connecting to ' + RELAY_URL, 'system');
        log(`Your ephemeral pubkey: <b style="color: ${colorFromPublicKey(pk)}" title="${pk}">${pk}</b>`, 'system');

        relay = await NostrTools.Relay.connect(RELAY_URL);

        updateStatus('● CONNECTED', 'connected');
        log('Connected successfully', 'system');

        // Subscribe to live events
        subscribeToEvents();
        fetchRecent();
      } catch (error) {
        updateStatus('● CONNECTION FAILED', 'error');
        log('Connection failed: ' + error.message, 'error');
        relay = null;
      }
    }

    function subscribeToEvents() {
      if (!relay) return;

      const now = Math.floor(Date.now() / 1000);

      sub = relay.subscribe([
        {
          kinds: [0, 1, 25555, 25556, 25557, 25558, 25559, 30317],
          since: now
        }
      ], {
        onevent(event) {
          handleEvent(event);
        },
        oneose() {
          log('End of stored events', 'eose');
        }
      });

      log('Subscribed to live events', 'system');
    }

    async function handleEvent(event) {
      allEvents.push(event);
      stats.total++;
      if (stats[event.kind] !== undefined) {
        stats[event.kind]++;
      }
      updateStats();

      if (event.kind === 25559 && event.pubkey !== pk) {
        if (event.content === 'ping') {
          await sendNostrPong(event.pubkey);
        }
      }

      const kindFilter = document.getElementById('kindFilter').value;
      if (kindFilter && event.kind !== parseInt(kindFilter)) {
        return; // Skip display if filtered
      }

      log('', 'event', event);
    }

    async function fetchRecent() {
      if (!relay) {
        await connect();
        if (!relay) return;
      }

      const fiveMinutesAgo = Math.floor(Date.now() / 1000) - (5 * 60);

      log('Fetching events from last 5 minutes...', 'system');

      const events = await relay.fetch([
        {
          kinds: [25555, 25556, 25557, 25558, 25559, 30317],
          since: fiveMinutesAgo
        }
      ], { timeout: 5000 });

      log(`Received ${events.length} historical events`, 'system');

      events.forEach(event => {
        allEvents.push(event);
        stats.total++;
        if (stats[event.kind] !== undefined) {
          stats[event.kind]++;
        }
        log('', 'event', event);
      });

      updateStats();
    }

    function disconnect() {
      if (sub) {
        sub.close();
        sub = null;
      }
      if (relay) {
        relay.close();
        relay = null;
      }
      updateStatus('● DISCONNECTED', 'disconnected');
      log('Disconnected from relay', 'system');
    }

    function sendWebsocketPing() {
      if (!relay) {
        log('Not connected, cannot send PING.', 'error');
        return;
      }
      try {
        relay.ws.send('["PING"]');
        log('--> PING', 'system');
      } catch (error) {
        log(`Error sending PING: ${error.message}`, 'error');
      }
    }

    async function sendNostrPong(recipientPk) {
        if (!relay) {
            log('Not connected, cannot send Nostr PONG.', 'error');
            return;
        }

        let event = {
            kind: 25559,
            created_at: Math.floor(Date.now() / 1000),
            tags: [['p', recipientPk]],
            content: 'pong'
        };

        const signedEvent = NostrTools.finalizeEvent(event, sk);

        try {
            await relay.publish(signedEvent);
            log(`Published a PONG event to ${recipientPk.slice(0,8)}...`, 'system', signedEvent);
        } catch (error) {
            log(`Error publishing PONG event: ${error.message}`, 'error');
        }
    }

    async function sendCinemaNote() {
        if (!relay) {
            log('Not connected, cannot send Cinema Note.', 'error');
            return;
        }

        // Backwards-compatible helper: publish current WHDA editor contents
        await publishWhda();
    }

    async function sendWhda() {
        if (!relay) {
            log('Not connected, cannot send WHDA.', 'error');
            return;
        }

        let event = {
            kind: 25559,
            created_at: Math.floor(Date.now() / 1000),
            tags: [],
            content: 'whda'
        };
        
        const signedEvent = NostrTools.finalizeEvent(event, sk);

        try {
            await relay.publish(signedEvent);
            log('Published a WHDA event', 'system', signedEvent);
        } catch (error) {
            log(`Error publishing WHDA event: ${error.message}`, 'error');
        }
    }

    async function handleWhdaAction() {
      const select = document.getElementById('whdaAction');
      if (!select) return;
      const value = select.value;
      // Reset selection so the same action can be chosen again
      select.value = '';

      if (value === 'load-latest') {
        await loadLatestWhda();
      } else if (value === 'new-note') {
        startNewWhda();
      } else if (value === 'publish') {
        await publishWhda();
      }
    }

    function startNewWhda() {
      const editor = document.getElementById('whdaEditor');
      if (!editor) return;

      const payload = {
        items: [
          {"infohash":"c9c47e7b12586a59d83e3e519570835625d44b3e","title":"Herzog Collection"},
          {"infohash":"A50DFEB595BA55726EEC43C691221188D2BE8471","title":"Lessons of Darkness (1992)"},
          {"infohash":"C5B2CB165B7CBBDE3A36262FA50FF818BE18207B","title":"Grizzly Man (2005)"},
          {"infohash":"7D8F3DA61332336454C4F4849FF5BA063DE0E191","title":"Cave of Forgotten Dreams (2010)"},
          {"infohash":"91C7CF39E3E25CBD77ABE92EF2C4A8029F1D123A","title":"Little Dieter Needs to Fly (1997)"},
          {"infohash":"2504A0C0D722CDA65ADEDB17DB4D61F366982A23","title":"The Great Ecstasy of Woodcarver Steiner (1974)"},
          {"infohash":"DA288753694BE9483F2B24E8D99DA6C77FCBC9A9","title":"The Wild Blue Yonder (2005)"},
          {"infohash":"460b0b5d942af2de6e3d69333c782f391fcc1ee0","title":"Charge – Blender Open Movie"}
        ]
      };

      editor.value = JSON.stringify(payload, null, 2);
      whdaDraftEvent = null;
      setWhdaStatus('New WHDA draft ready for editing');
      log('Initialized new WHDA draft in editor', 'system');
    }

    async function loadLatestWhda() {
      if (!relay) {
        await connect();
        if (!relay) return;
      }

      const editor = document.getElementById('whdaEditor');
      if (!editor) return;

      setWhdaStatus('Loading latest WHDA from relay...');
      log('Fetching latest WHDA note from relay...', 'system');

      const since = Math.floor(Date.now() / 1000) - 24 * 60 * 60;

      try {
        const events = await relay.fetch([
          {
            kinds: [30317],
            '#d': ['WHDA'],
            since
          }
        ], { timeout: 5000 });

        if (!events || events.length === 0) {
          setWhdaStatus('No WHDA note found in last 24h');
          log('No WHDA notes found in last 24h', 'system');
          return;
        }

        const latest = events.reduce((a, b) =>
          (a.created_at || 0) > (b.created_at || 0) ? a : b
        );

        whdaDraftEvent = latest;

        let content = latest.content || '';
        try {
          content = JSON.stringify(JSON.parse(content), null, 2);
        } catch (e) {
          // keep raw content if not JSON
        }

        editor.value = content;
        setWhdaStatus('Loaded latest WHDA from relay');
        log('Loaded latest WHDA note from relay', 'system', latest);
      } catch (error) {
        setWhdaStatus('Failed to load WHDA from relay');
        log(`Error fetching WHDA note: ${error.message}`, 'error');
      }
    }

    async function publishWhda() {
      if (!relay) {
        log('Not connected, cannot publish WHDA.', 'error');
        return;
      }

      const editor = document.getElementById('whdaEditor');
      if (!editor) {
        log('WHDA editor not found in DOM.', 'error');
        return;
      }

      let payload;
      const raw = editor.value.trim();

      if (!raw) {
        log('WHDA editor is empty; initializing default payload.', 'system');
        startNewWhda();
        return;
      }

      try {
        payload = JSON.parse(raw);
      } catch (error) {
        log('WHDA content is not valid JSON; not publishing.', 'error');
        setWhdaStatus('Invalid JSON in WHDA editor');
        return;
      }

      let tags = [
        ['d', 'WHDA'],
        ['t', 'cinema'],
        ['t', 'herzog'],
        ['client', 'relaylog']
      ];

      if (whdaDraftEvent && Array.isArray(whdaDraftEvent.tags)) {
        tags = whdaDraftEvent.tags.slice();
        const hasD = tags.some(t => t[0] === 'd');
        if (!hasD) {
          tags.push(['d', 'WHDA']);
        }
      }

      const event = {
        kind: 30317,
        created_at: Math.floor(Date.now() / 1000),
        tags,
        content: JSON.stringify(payload)
      };

      const signedEvent = NostrTools.finalizeEvent(event, sk);

      try {
        await relay.publish(signedEvent);
        whdaDraftEvent = signedEvent;
        setWhdaStatus('Published WHDA note to relay');
        log('Published WHDA note to relay', 'system', signedEvent);
      } catch (error) {
        setWhdaStatus('Failed to publish WHDA note');
        log(`Error publishing WHDA note: ${error.message}`, 'error');
      }
    }


    function clearLog() {
      document.getElementById('log').innerHTML = '';
      log('Log cleared', 'system');
    }

    function applyFilter() {
      const logDiv = document.getElementById('log');
      logDiv.innerHTML = '';

      const kindFilter = document.getElementById('kindFilter').value;

      const filtered = kindFilter
        ? allEvents.filter(e => e.kind === parseInt(kindFilter))
        : allEvents;

      filtered.reverse().forEach(event => {
        log('', 'event', event);
      });

      log(`Showing ${filtered.length} of ${allEvents.length} events`, 'system');
    }

    // Auto-connect on load
    window.addEventListener('load', () => {
      setTimeout(connect, 500);
    });
  </script>
</body>
</html>
