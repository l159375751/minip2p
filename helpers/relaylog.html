<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>relay.0x6d.net - Live Feed</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a0a;
      color: #00ff00;
      font-family: 'Courier New', monospace;
      padding: 20px;
      font-size: 14px;
      line-height: 1.4;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      border: 2px solid #00ff00;
      padding: 15px;
      background: #000;
      box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
      font-size: 24px;
      text-shadow: 0 0 10px #00ff00;
      animation: glow 2s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from { text-shadow: 0 0 5px #00ff00, 0 0 10px #00ff00; }
      to { text-shadow: 0 0 10px #00ff00, 0 0 20px #00ff00, 0 0 30px #00ff00; }
    }

    .status {
      text-align: center;
      margin-bottom: 15px;
      padding: 8px;
      background: #001a00;
      border: 1px solid #00ff00;
    }

    .status.connected { color: #00ff00; }
    .status.disconnected { color: #ff0000; }
    .status.connecting { color: #ffff00; }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      background: #001a00;
      color: #00ff00;
      border: 1px solid #00ff00;
      padding: 8px 16px;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      transition: all 0.2s;
    }

    button:hover {
      background: #00ff00;
      color: #000;
      box-shadow: 0 0 10px #00ff00;
    }

    button:active {
      transform: scale(0.95);
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 16px;
      margin-bottom: 10px;
    }

    .stat {
      background: transparent;
      border: none;
      padding: 0;
      text-align: left;
      display: flex;
      gap: 4px;
      align-items: baseline;
    }

    .stat-label {
      color: #00aa00;
      font-size: 11px;
    }

    .stat-value {
      color: #00ff00;
      font-size: 11px;
      font-weight: bold;
    }

    .log-container {
      background: #000;
      border: 1px solid #00ff00;
      padding: 10px;
      height: 500px;
      overflow-y: auto;
      font-size: 12px;
    }

    .log-entry {
      margin-bottom: 8px;
      padding: 5px;
      border-left: 3px solid transparent;
      word-wrap: break-word;
    }

    .log-entry.event { border-left-color: #00ff00; background: #001a00; }
    .log-entry.req { border-left-color: #0088ff; background: #001a1a; }
    .log-entry.eose { border-left-color: #ffaa00; background: #1a1a00; }
    .log-entry.ok { border-left-color: #ff00ff; background: #1a001a; }
    .log-entry.system { border-left-color: #888888; background: #0a0a0a; }
    .log-entry.error { border-left-color: #ff0000; background: #1a0000; }

    .timestamp {
      color: #00aa00;
      margin-right: 10px;
    }

    .type {
      color: #ffff00;
      font-weight: bold;
      margin-right: 10px;
    }

    .kind {
      color: #ff00ff;
      margin-right: 10px;
    }

    .content {
      color: #00ff00;
    }

    .log-container::-webkit-scrollbar {
      width: 8px;
    }

    .log-container::-webkit-scrollbar-track {
      background: #000;
    }

    .log-container::-webkit-scrollbar-thumb {
      background: #00ff00;
      border: 1px solid #000;
    }

    .log-container::-webkit-scrollbar-thumb:hover {
      background: #00aa00;
    }

    select {
      background: #001a00;
      color: #00ff00;
      border: 1px solid #00ff00;
      padding: 8px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
    }

    .expandable-json summary {
      cursor: pointer;
      color: #00aa00;
      font-size: 11px;
      margin-top: 5px;
      outline: none;
    }
    .expandable-json summary:hover {
      text-decoration: underline;
    }
    .expandable-json pre {
      background: #001a00;
      border: 1px solid #00ff00;
      padding: 10px;
      margin-top: 5px;
      white-space: pre-wrap;
      word-break: break-all;
      color: #00ff00;
    }

    .whda-panel {
      display: none;
      margin-bottom: 15px;
      background: #001a00;
      border: 1px solid #00ff00;
      padding: 8px;
    }

    .whda-panel.whda-panel--visible {
      display: block;
    }

    .whda-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
      font-size: 12px;
      color: #00ff00;
    }

    .whda-textarea {
      width: 100%;
      min-height: 140px;
      background: #000;
      color: #00ff00;
      border: 1px solid #00ff00;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      padding: 6px;
      resize: vertical;
      margin-bottom: 4px;
    }

    .whda-status {
      font-size: 11px;
      color: #00aa00;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>╔══ RELAY.0X6D.NET ══╗</h1>

    <div class="status" id="status">● CONNECTING...</div>

    <div class="controls">
      <button onclick="connect()">CONNECT</button>
      <button onclick="disconnect()">DISCONNECT</button>
      <button onclick="sendNostrPing()">NOSTR PING</button>
      <button onclick="sendDemoData()">SEND DEMO DATA</button>
      <button onclick="clearLog()">CLEAR LOG</button>
      <label style="color: #00ff00;">
        Fetch:
        <select id="fetchRange" onchange="fetchRecent()">
          <option value="10080">1 week</option>
          <option value="1440">1 day</option>
          <option value="60">1 hour</option>
          <option value="5">5 min</option>
          <option value="all">All</option>
        </select>
      </label>
      <label style="color: #00ff00;">
        Filter:
        <select id="kindFilter" onchange="applyFilter()">
          <option value="">All Events</option>
          <option value="25555">25555 (Search)</option>
          <option value="25556">25556 (Response)</option>
          <option value="25557">25557 (Who Has)</option>
          <option value="25558">25558 (Availability)</option>
          <option value="25559">25559 (Ping/Pong)</option>
          <option value="30317">30317 (Cinema)</option>
          <option value="1">1 (Notes)</option>
          <option value="0">0 (Metadata)</option>
        </select>
      </label>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-label">EVENTS</div>
        <div class="stat-value" id="eventCount">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">CINEMA</div>
        <div class="stat-value" id="cinemaCount">0</div>
      </div>
    </div>

    <div class="whda-panel">
      <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 8px;">
        <label style="color: #00ff00; margin: 0;">
          d=
          <select id="collectionSelect" onchange="onCollectionChange()">
            <option value="WHDA">WHDA</option>
            <option value="BLNR">BLNR</option>
          </select>
        </label>
        <select id="collectionAction" onchange="handleCollectionAction()" style="background: #001a00; color: #00ff00; border: 1px solid #00ff00; padding: 8px; font-family: 'Courier New', monospace; font-size: 12px;">
          <option value="">--</option>
          <option value="load-latest">Load</option>
          <option value="new-note">New</option>
          <option value="publish">Publish</option>
        </select>
        <span class="whda-status" id="whdaStatus" style="margin-left: auto;">Idle</span>
      </div>
      <textarea
        id="whdaEditor"
        class="whda-textarea"
        placeholder="WHDA JSON will appear here when you load the latest note or start a new one. Edit and publish back to the relay."
      ></textarea>
    </div>

    <div class="log-container" id="log"></div>
  </div>

  <script src="https://unpkg.com/nostr-tools@2.7.2/lib/nostr.bundle.js"></script>
  <script>
    const RELAY_URL = 'wss://relay.0x6d.net';
    let relay = null;
    let sub = null;
    let allEvents = [];
    let stats = {
      total: 0,
      25555: 0,
      25556: 0,
      25557: 0,
      25558: 0,
      25559: 0,
      30317: 0
    };
    let sk = null;
    let pk = null;
    let whdaDraftEvent = null;

    const FANCY_COLORS = [
      '#7b68ee', '#ee82ee', '#ff69b4', '#00ff7f', '#40e0d0', '#1e90ff', '#ffdead', '#ff8c00', '#ff4500'
    ];

    function colorFromPublicKey(pk) {
        let hash = 0;
        if (pk.length === 0) return FANCY_COLORS[0];
        for (let i = 0; i < pk.length; i++) {
            hash = pk.charCodeAt(i) + ((hash << 5) - hash);
            hash = hash & hash;
        }
        return FANCY_COLORS[Math.abs(hash) % FANCY_COLORS.length];
    }

    function initializeKeys() {
        if (!sk) {
            try {
                sk = NostrTools.generateSecretKey();
                pk = NostrTools.getPublicKey(sk);
            } catch (e) {
                console.error("Failed to initialize Nostr keys", e);
                log('Fatal: Failed to initialize Nostr keys.', 'error');
            }
        }
    }

    function ensureWhdaVisible() {
      const panel = document.querySelector('.whda-panel');
      if (panel) {
        panel.classList.add('whda-panel--visible');
      }
    }

    function setWhdaStatus(message) {
      const el = document.getElementById('whdaStatus');
      if (el) el.textContent = message;
    }

    function updateStatus(message, state = 'connecting') {
      const status = document.getElementById('status');
      status.textContent = message;
      status.className = 'status ' + state;
    }

    function getEventTypeName(kind) {
      const kindNames = {
        0: 'metadata',
        1: 'note',
        25555: 'search',
        25556: 'response',
        25557: 'who-has',
        25558: 'available',
        25559: 'ping/pong',
        30317: 'cinema'
      };
      return kindNames[kind] || '';
    }

    function log(message, type = 'system', data = null) {
      const logDiv = document.getElementById('log');
      const entry = document.createElement('div');
      entry.className = 'log-entry ' + type;

      const now = new Date();
      const timestamp = now.toTimeString().split(' ')[0];

      let html = `<span class="timestamp">[${timestamp}]</span>`;

      if (type === 'event' && data && data.pubkey) {
          const color = colorFromPublicKey(data.pubkey);
          const kindName = getEventTypeName(data.kind);
          const kindLabel = kindName ? `kind:${data.kind} "${kindName}"` : `kind:${data.kind}`;

          // Extract d tag if present
          let dTag = '';
          if (data.tags) {
            const dTagArray = data.tags.find(tag => tag[0] === 'd');
            if (dTagArray && dTagArray[1]) {
              const dValue = dTagArray[1].substring(0, 8);
              dTag = ` d=${dValue}`;
            }
          }

          html += `<span class="content">Event from <b style="color: ${color};" title="${data.pubkey}">${data.pubkey}</b> ${kindLabel}${dTag}</span>`;

          if (data.kind === 30317) {
              try {
                  const contentJSON = JSON.parse(data.content);
                  const prettyJSON = JSON.stringify(contentJSON, null, 2);
                  const editorId = 'editor_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                  const dTagValue = data.tags ? (data.tags.find(t => t[0] === 'd')?.[1] || '') : '';
                  html += `<details class="expandable-json">
                    <summary>show/edit/send Content</summary>
                    <textarea id="${editorId}" style="width: 100%; min-height: 200px; font-family: monospace; font-size: 12px;">${prettyJSON}</textarea>
                    <button onclick="sendEditedContent('${editorId}', '${dTagValue}', ${data.kind})">SEND</button>
                  </details>`;
              } catch (e) {
                  if (data.content) {
                    html += ` <span class="content">"${data.content}"</span>`;
                  }
              }
          } else {
              if (data.content && data.content.length < 100) {
                html += ` <span class="content">"${data.content}"</span>`;
              }
          }
      } else {
        html += `<span class="type">${type.toUpperCase()}</span>`;
        html += `<span class="content">${message}</span>`;
        if (data) {
            if (data.kind) {
              html += ` <span class="kind">kind:${data.kind}</span>`;
            }
            if (data.content && data.content.length < 100) {
              html += ` <span class="content">"${data.content}"</span>`;
            }
        }
      }

      entry.innerHTML = html;
      logDiv.insertBefore(entry, logDiv.firstChild);

      // Keep max 100 entries
      while (logDiv.children.length > 100) {
        logDiv.removeChild(logDiv.lastChild);
      }
    }

    function updateStats() {
      document.getElementById('eventCount').textContent = stats.total;
      document.getElementById('cinemaCount').textContent = stats[30317] || 0;
    }

    async function connect() {
      if (relay) {
        log('Already connected', 'system');
        return;
      }
      initializeKeys();

	      try {
	        updateStatus('● CONNECTING ' + RELAY_URL, 'connecting');
	        log('Connecting to ' + RELAY_URL, 'system');
        log(`Your ephemeral pubkey: <b style="color: ${colorFromPublicKey(pk)}" title="${pk}">${pk}</b>`, 'system');

	        relay = await NostrTools.Relay.connect(RELAY_URL);
	
	        updateStatus('● CONNECTED ' + RELAY_URL, 'connected');
	        log('Connected successfully to ' + RELAY_URL, 'system');

        // Subscribe to live events
        subscribeToEvents();
        fetchRecent();
	      } catch (error) {
	        updateStatus('● CONNECTION FAILED ' + RELAY_URL, 'error');
	        log('Connection failed to ' + RELAY_URL + ': ' + error.message, 'error');
        relay = null;
      }
    }

    function subscribeToEvents() {
      if (!relay) return;

      const now = Math.floor(Date.now() / 1000);

      sub = relay.subscribe([
        {
          kinds: [0, 1, 25555, 25556, 25557, 25558, 25559, 30317],
          since: now
        }
      ], {
        onevent(event) {
          handleEvent(event);
        },
        oneose() {
          log('End of stored events', 'eose');
        }
      });

      log('Subscribed to live events', 'system');
    }

    async function handleEvent(event) {
      allEvents.push(event);
      stats.total++;
      if (stats[event.kind] !== undefined) {
        stats[event.kind]++;
      }
      updateStats();

      if (event.kind === 25559 && event.pubkey !== pk) {
        if (event.content === 'ping') {
          await sendNostrPong(event.pubkey);
        }
      }

      const kindFilter = document.getElementById('kindFilter').value;
      if (kindFilter && event.kind !== parseInt(kindFilter)) {
        return; // Skip display if filtered
      }

      log('', 'event', event);
    }

    async function fetchOnce(filters, timeoutMs) {
      if (!relay) return [];

      return new Promise((resolve) => {
        const events = [];
        let finished = false;

        const timer = setTimeout(() => {
          if (finished) return;
          finished = true;
          if (tempSub) tempSub.close();
          resolve(events);
        }, typeof timeoutMs === 'number' ? timeoutMs : 5000);

        const tempSub = relay.subscribe(filters, {
          onevent(event) {
            events.push(event);
          },
          oneose() {
            if (finished) return;
            finished = true;
            clearTimeout(timer);
            tempSub.close();
            resolve(events);
          }
        });
      });
    }

    async function fetchRecent() {
      if (!relay) {
        await connect();
        if (!relay) return;
      }

      const rangeSelect = document.getElementById('fetchRange');
      const rangeValue = rangeSelect.value;
      const rangeText = rangeSelect.options[rangeSelect.selectedIndex].text;

      let since = 0;
      let logMessage = `Fetching all events...`;

      if (rangeValue !== 'all') {
        const minutes = parseInt(rangeValue, 10);
        since = Math.floor(Date.now() / 1000) - (minutes * 60);
        logMessage = `Fetching events from last ${rangeText}...`;
      }

      log(logMessage, 'system');

      // Add missing kinds 0 and 1 to be consistent with live subscription
      const filter = {
        kinds: [0, 1, 25555, 25556, 25557, 25558, 25559, 30317]
      };

      if (since > 0) {
        filter.since = since;
      }

      const events = await fetchOnce([filter], 5000);

      log(`Received ${events.length} historical events`, 'system');

      const kindFilter = document.getElementById('kindFilter').value;

      events.forEach(event => {
        // Add events to master list regardless of filter
        allEvents.push(event);
        stats.total++;
        if (stats[event.kind] !== undefined) {
          stats[event.kind]++;
        }
        
        // But only log it if it matches the current filter
        const matchesFilter = !kindFilter || event.kind === parseInt(kindFilter);
        if (matchesFilter) {
          log('', 'event', event);
        }
      });

      updateStats();
    }

    function disconnect() {
      if (sub) {
        sub.close();
        sub = null;
      }
	      if (relay) {
	        relay.close();
	        relay = null;
	      }
	      updateStatus('● DISCONNECTED ' + RELAY_URL, 'disconnected');
	      log('Disconnected from relay ' + RELAY_URL, 'system');
    }

    async function sendNostrPong(recipientPk) {
        if (!relay) {
            log('Not connected, cannot send Nostr PONG.', 'error');
            return;
        }

        let event = {
            kind: 25559,
            created_at: Math.floor(Date.now() / 1000),
            tags: [['p', recipientPk]],
            content: 'pong'
        };

        const signedEvent = NostrTools.finalizeEvent(event, sk);

        try {
            await relay.publish(signedEvent);
            log(`Published a PONG event to ${recipientPk.slice(0,8)}...`, 'system', signedEvent);
        } catch (error) {
            log(`Error publishing PONG event: ${error.message}`, 'error');
        }
    }

    async function sendCinemaNote() {
        if (!relay) {
            log('Not connected, cannot send Cinema Note.', 'error');
            return;
        }

        // Backwards-compatible helper: publish current WHDA editor contents
        await publishWhda();
    }

	    async function sendWhda() {
        if (!relay) {
            log('Not connected, cannot send WHDA.', 'error');
            return;
	    }

        // Legacy WHDA helper left intentionally blank.
        // The WHDA editor + publish flow handles this now.
    }

    async function sendNostrPing() {
      if (!relay) {
        log('Not connected, cannot send Nostr PING.', 'error');
        return;
      }

      const event = {
        kind: 25559,
        created_at: Math.floor(Date.now() / 1000),
        tags: [],
        content: 'ping'
      };

      const signedEvent = NostrTools.finalizeEvent(event, sk);

      try {
        await relay.publish(signedEvent);
        log('Published a PING event', 'system', signedEvent);
      } catch (error) {
        log(`Error publishing PING event: ${error.message}`, 'error');
      }
    }

    async function sendDemoData() {
      if (!relay) {
        log('Not connected, cannot send demo data.', 'error');
        return;
      }

      log('Sending demo cinema collections...', 'system');

      // Send WHDA collection
      const whdaEvent = {
        kind: 30317,
        created_at: Math.floor(Date.now() / 1000),
        tags: [
          ['d', 'WHDA'],
          ['t', 'cinema'],
          ['t', 'herzog'],
          ['client', 'relaylog']
        ],
        content: JSON.stringify(DEFAULT_PAYLOADS.WHDA)
      };

      const whdaSigned = NostrTools.finalizeEvent(whdaEvent, sk);

      try {
        await relay.publish(whdaSigned);
        log('Published WHDA demo collection', 'system', whdaSigned);
      } catch (error) {
        log(`Error publishing WHDA: ${error.message}`, 'error');
      }

      // Send BLNR collection
      const blnrEvent = {
        kind: 30317,
        created_at: Math.floor(Date.now() / 1000),
        tags: [
          ['d', 'BLNR'],
          ['t', 'cinema'],
          ['t', 'blender'],
          ['client', 'relaylog']
        ],
        content: JSON.stringify(DEFAULT_PAYLOADS.BLNR)
      };

      const blnrSigned = NostrTools.finalizeEvent(blnrEvent, sk);

      try {
        await relay.publish(blnrSigned);
        log('Published BLNR demo collection', 'system', blnrSigned);
      } catch (error) {
        log(`Error publishing BLNR: ${error.message}`, 'error');
      }
    }

    const DEFAULT_PAYLOADS = {
      WHDA: {
        items: [
          {"infohash":"c9c47e7b12586a59d83e3e519570835625d44b3e","title":"Herzog Collection"},
          {"infohash":"A50DFEB595BA55726EEC43C691221188D2BE8471","title":"Lessons of Darkness (1992)"},
          {"infohash":"C5B2CB165B7CBBDE3A36262FA50FF818BE18207B","title":"Grizzly Man (2005)"},
          {"infohash":"7D8F3DA61332336454C4F4849FF5BA063DE0E191","title":"Cave of Forgotten Dreams (2010)"}
        ]
      },
      BLNR: {
        items: [
          {"infohash":"460b0b5d942af2de6e3d69333c782f391fcc1ee0","title":"Charge – Blender Open Movie"}
        ]
      }
    };

    function onCollectionChange() {
      const collection = document.getElementById('collectionSelect').value;
      const header = document.getElementById('collectionPanelHeader');
      if (header) {
        header.textContent = `${collection} note editor (kind 30317 / d=${collection})`;
      }
      // Optionally, clear the editor or load the default for the new collection
      document.getElementById('whdaEditor').value = '';
      setWhdaStatus('Switched to ' + collection);
    }

    async function handleCollectionAction() {
      const actionSelect = document.getElementById('collectionAction');
      const collectionSelect = document.getElementById('collectionSelect');
      if (!actionSelect || !collectionSelect) return;

      const action = actionSelect.value;
      const collection = collectionSelect.value;
      
      // Reset selection
      actionSelect.value = '';

      if (action === 'load-latest') {
        await loadLatestNote(collection);
      } else if (action === 'new-note') {
        startNewNote(collection);
      } else if (action === 'publish') {
        await publishNote(collection);
      }
    }

    function startNewNote(collection) {
      const editor = document.getElementById('whdaEditor');
      if (!editor) return;

      ensureWhdaVisible();

      const payload = DEFAULT_PAYLOADS[collection] || { items: [] };

      editor.value = JSON.stringify(payload, null, 2);
      whdaDraftEvent = null; // Reset draft event
      setWhdaStatus(`New ${collection} draft ready for editing`);
      log(`Initialized new ${collection} draft in editor`, 'system');
    }

    async function loadLatestNote(collection) {
      if (!relay) {
        await connect();
        if (!relay) return;
      }

      const editor = document.getElementById('whdaEditor');
      if (!editor) return;

      ensureWhdaVisible();

      setWhdaStatus(`Loading latest ${collection} from relay...`);
      log(`Fetching latest ${collection} note from relay...`, 'system');

      const since = Math.floor(Date.now() / 1000) - 24 * 60 * 60;

      try {
        const events = await fetchOnce([
          {
            kinds: [30317],
            '#d': [collection],
            since
          }
        ], 5000);

        if (!events || events.length === 0) {
          setWhdaStatus(`No ${collection} note found in last 24h`);
          log(`No ${collection} notes found in last 24h`, 'system');
          return;
        }

        const latest = events.reduce((a, b) =>
          (a.created_at || 0) > (b.created_at || 0) ? a : b
        );

        whdaDraftEvent = latest;

        let content = latest.content || '';
        try {
          content = JSON.stringify(JSON.parse(content), null, 2);
        } catch (e) {
          // keep raw content if not JSON
        }

        editor.value = content;
        setWhdaStatus(`Loaded latest ${collection} from relay`);
        log(`Loaded latest ${collection} note from relay`, 'system', latest);
      } catch (error) {
        setWhdaStatus(`Failed to load ${collection} from relay`);
        log(`Error fetching ${collection} note: ${error.message}`, 'error');
      }
    }

    async function publishNote(collection) {
      if (!relay) {
        log('Not connected, cannot publish.', 'error');
        return;
      }

      const editor = document.getElementById('whdaEditor');
      if (!editor) {
        log('Editor not found in DOM.', 'error');
        return;
      }

      ensureWhdaVisible();

      const raw = editor.value.trim();
      if (!raw) {
        log(`Editor is empty; initializing default payload for ${collection}.`, 'system');
        startNewNote(collection);
        return;
      }
      
      let payload;
      try {
        payload = JSON.parse(raw);
      } catch (error) {
        log(`Content for ${collection} is not valid JSON; not publishing.`, 'error');
        setWhdaStatus('Invalid JSON in editor');
        return;
      }

      let tags = [
        ['d', collection],
        ['t', 'cinema'],
        ['client', 'relaylog']
      ];
      // Add specific tag for collection if needed
      if (collection.toLowerCase() === 'whda') tags.push(['t', 'herzog']);
      if (collection.toLowerCase() === 'blnr') tags.push(['t', 'blender']);

      const event = {
        kind: 30317,
        created_at: Math.floor(Date.now() / 1000),
        tags,
        content: JSON.stringify(payload)
      };

      const signedEvent = NostrTools.finalizeEvent(event, sk);

      try {
        await relay.publish(signedEvent);
        whdaDraftEvent = signedEvent; // Still using the same draft event variable
        setWhdaStatus(`Published ${collection} note to relay`);
        log(`Published ${collection} note to relay`, 'system', signedEvent);
      } catch (error) {
        setWhdaStatus(`Failed to publish ${collection} note`);
        log(`Error publishing ${collection} note: ${error.message}`, 'error');
      }
    }

    async function sendEditedContent(editorId, dTagValue, kind) {
      if (!relay) {
        log('Not connected, cannot send.', 'error');
        return;
      }

      const editor = document.getElementById(editorId);
      if (!editor) {
        log('Editor not found.', 'error');
        return;
      }

      const raw = editor.value.trim();
      if (!raw) {
        log('Editor is empty; nothing to send.', 'error');
        return;
      }

      let payload;
      try {
        payload = JSON.parse(raw);
      } catch (error) {
        log('Content is not valid JSON; not sending.', 'error');
        return;
      }

      let tags = [
        ['d', dTagValue],
        ['t', 'cinema'],
        ['client', 'relaylog']
      ];

      // Add specific tag based on collection
      if (dTagValue.toLowerCase() === 'whda') tags.push(['t', 'herzog']);
      if (dTagValue.toLowerCase() === 'blnr') tags.push(['t', 'blender']);

      const event = {
        kind: kind,
        created_at: Math.floor(Date.now() / 1000),
        tags: tags,
        content: JSON.stringify(payload),
        pubkey: pk
      };

      const signedEvent = NostrTools.finalizeEvent(event, sk);

      try {
        await relay.publish(signedEvent);
        log(`Published edited ${dTagValue} note to relay`, 'system', signedEvent);
      } catch (error) {
        log(`Error publishing edited note: ${error.message}`, 'error');
      }
    }


    function clearLog() {
      document.getElementById('log').innerHTML = '';
      log('Log cleared', 'system');
    }

    function applyFilter() {
      const logDiv = document.getElementById('log');
      logDiv.innerHTML = '';

      const kindFilter = document.getElementById('kindFilter').value;

      const filtered = kindFilter
        ? allEvents.filter(e => e.kind === parseInt(kindFilter))
        : allEvents;

      filtered.reverse().forEach(event => {
        log('', 'event', event);
      });

      log(`Showing ${filtered.length} of ${allEvents.length} events`, 'system');
    }

    // Auto-connect on load
    window.addEventListener('load', () => {
      setTimeout(connect, 500);
    });
  </script>
</body>
</html>
